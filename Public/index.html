<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Látogatók száma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body { font-family: Arial; padding: 20px; }
        ul { list-style: none; padding: 0; }
        li { margin: 5px 0; background: #f1f1f1; padding: 8px; border-radius: 6px; }
        div {margin: 5px;}
    </style>
</head>
<body>
<div class="grid grid-cols-2 gap-4">
    <div id="MainDiv" class="row m-1 text-center">


        <div class="card text-bg-primary col-md-12 text-center">
            <div class="card-header h1">Számláló hozzáadása</div>
            <div class="card-body row m-4">
                <input id="CounterName" type="text">
                <button class="btn text-bg-warning col-md-10" onclick="CreateCounter('CounterName')"><span class="h2">Create</span></button>
                <button class="btn text-bg-info col-md-2" onclick="AddCounterToView()"><span class="h2">Add counter</span></button>
            </div>
        </div>

    </div>
    <div class="row m-4">

    </div>
</div>
<script crossorigin="anonymous" src="app.js"></script>
</body>
</html>

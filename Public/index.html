<body>
<details> <summary class="btn col-md-12 btn-warning text-center">Számlálók szerkesztése</summary>

        <div class="card-header h1">Számláló hozzáadása</div>
        <div class="card-body row m-4">
            <input id="CounterName" type="text">
            <button class="btn text-bg-warning col-md-6" onclick="CreateCounter()"><span
                    class="h2">Create</span></button>
            <button class="btn text-bg-info col-md-6" onclick="DeleteCounter()"><span
                    class="h2">Delete</span></button>
        </div>
    </div>
</details>
<div class="grid grid-cols-2 gap-4">
    <div id="MainDiv" class="row m-1 text-center">

    </div>
    <div class="row m-4">

    </div>
